services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: intelligence_api
    restart: unless-stopped
    environment:
      # host.docker.internal routes traffic from the container to your host machine's port 3003
      DATABASE_URL: postgresql://datapunk:datapunk_secret@host.docker.internal:3003/intelligence_db
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: intelligence_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
